<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dark">

    <div id="login-view" class="card">
        <h1>ACCESS TERMINAL</h1>

        <div class="field">
            <label for="username">Username</label>
            <input id="username" placeholder="Enter username">
        </div>

        <div class="field">
            <label for="gender">Gender</label>
            <select id="gender">
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="other">Other</option>
            </select>
        </div>

        <button id="start">Start Game</button>
    </div>

    <div id="home-view" class="hidden">
        <h1>Rooms</h1>

        <div class="rooms">
            <button data-room="room1">
                <span class="label">Room 1</span>
                <span class="lock">🔒</span>
            </button>

            <button data-room="room2">
                <span class="label">Room 2</span>
                <span class="lock">🔒</span>
            </button>

            <button data-room="room3">
                <span class="label">Room 3</span>
                <span class="lock">🔒</span>
            </button>

            <button data-room="room4">
                <span class="label">Room 4</span>
                <span class="lock">🔒</span>
            </button>

            <button data-room="room5">
                <span class="label">Room 5</span>
                <span class="lock">🔒</span>
            </button>

        </div>

        <button id="reset" class="danger hidden">
            Restart Game
        </button>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
