<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Progress</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="card">
        <h1>Your Progress</h1>

        <table id="progress-table" style="margin: 20px auto; border-collapse: collapse;">
            <thead>
                <tr>
                    <th>Room</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <button onclick="location.href='index.html'">Back to Rooms</button>
    </div>

    <script>
        const username = localStorage.getItem("username");

        if (!username) {
            location.href = "index.html";
        }

        fetch(`/progress/${username}`)
            .then(res => res.json())
            .then(data => {
                const progress = data.progress ?? data;

                const tbody = document.querySelector("#progress-table tbody");
                tbody.innerHTML = "";

                Object.entries(progress).forEach(([room, status]) => {
                    if (room === "completed") return;

                    const tr = document.createElement("tr");

                    const roomTd = document.createElement("td");
                    roomTd.textContent = room.replace("room", "Room ");

                    const statusTd = document.createElement("td");

                    let icon = "";
                    let label = "";
                    let className = "";

                    if (status === "locked") {
                        icon = "🔒";
                        label = "Locked";
                        className = "status-locked";
                    } else if (status === "unlocked") {
                        icon = "🔓";
                        label = "Unlocked";
                        className = "status-unlocked";
                    } else if (status === "completed") {
                        icon = "✅";
                        label = "Completed";
                        className = "status-completed";
                    }

                    statusTd.textContent = `${icon} ${label}`;
                    statusTd.classList.add(className);

                    tr.appendChild(roomTd);
                    tr.appendChild(statusTd);
                    tbody.appendChild(tr);
                });

            });
    </script>
</body>

</html>
